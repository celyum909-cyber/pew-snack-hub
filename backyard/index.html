function resize(){const r=game.getBoundingClientRect();bw=r.width;bh=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(bw*dpr);canvas.height=Math.round(bh*dpr)}new ResizeObserver(resize).observe(game);
// Normalized target geometry follows the background asset. All physics is independent of viewport size.

 const moving=movingTargets(time,n),ballRadius=(moving.length?.032:.0225)*bw;

function drawMovingTargets(){for(const [i,t] of movingTargets().entries()){const x=t.x*bw,y=t.y*bh,r=t.r*bw;ctx.save();ctx.fillStyle=i?'rgba(240,70,85,.13)':'rgba(255,45,65,.16)';ctx.strokeStyle=i?'rgba(255,180,140,.85)':'rgba(255,65,82,.85)';ctx.lineWidth=i?3:4;ctx.shadowColor='#9b1020';ctx.shadowBlur=5;ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.arc(x,y,r,0,Math.PI*2,true);ctx.fill('evenodd');ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore()}}
